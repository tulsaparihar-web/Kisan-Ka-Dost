name: Android Instrumentation Tests

on:
  workflow_dispatch:

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  instrumentation-tests:
    name: Emulator instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and verify Plant Doctor model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/YeshwanthRajSelvaraj/AgroVision-AI/150bf1c847cba7e70adc595d3685ed01e366434b/FarmerFriendApp/app/src/main/assets/model.tflite \
            --output app/src/main/assets/plant_disease_model.tflite
          actual_blob=$(git hash-object app/src/main/assets/plant_disease_model.tflite)
          test "$actual_blob" = "17967ab19d1d7bfedb36cfcdbd959ea518700793"

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon :app:testDebugUnitTest :app:connectedDebugAndroidTest
